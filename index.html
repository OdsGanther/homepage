<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <title>Homepage</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      color-scheme: dark;
      --bg: #101411;
      --panel: #181e19;
      --panel-2: #1e2620;
      --panel-hover: #242d26;
      --line: rgba(220, 238, 222, .09);
      --text: #eef3eb;
      --muted: #9aa69b;
      --soft: #6f7b71;
      --green: #c5f36b;
      --green-dark: #19230e;
      --orange: #ffb27b;
      --shadow: 0 24px 70px rgba(0, 0, 0, .22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text); background:
        radial-gradient(ellipse 50% 35% at 92% 0%, rgba(115, 151, 74, .11), transparent 75%),
        radial-gradient(ellipse 45% 42% at 0% 100%, rgba(54, 97, 75, .1), transparent 75%), var(--bg);
      font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1160px, calc(100% - 48px)); margin: 0 auto; padding: 34px 0 64px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 68px; }
    .brand { display: flex; align-items: center; gap: 11px; font: 800 17px 'Manrope', sans-serif; letter-spacing: -.5px; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: var(--green); color: #17200e; }
    .brand-mark svg { width: 19px; height: 19px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .date-pill, .icon-button { height: 39px; border: 1px solid var(--line); border-radius: 99px; background: rgba(255,255,255,.025); color: var(--muted); }
    .date-pill { display: flex; align-items: center; padding: 0 14px; font: 11px 'DM Mono', monospace; letter-spacing: .02em; }
    .icon-button { width: 39px; display: grid; place-items: center; cursor: pointer; transition: .18s ease; }
    .icon-button:hover { color: var(--text); background: var(--panel-hover); border-color: rgba(220,238,222,.18); }
    .icon-button svg { width: 16px; height: 16px; }
    .intro { margin-bottom: 32px; }
    .eyebrow { color: var(--green); font: 500 10px 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .16em; }
    h1 { margin: 10px 0 0; font: 600 clamp(34px, 5vw, 54px)/1.08 'Manrope', sans-serif; letter-spacing: -2.6px; }
    h1 span { color: #879188; font-weight: 400; }
    .subtitle { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
    .search-wrap { position: relative; margin: 27px 0 50px; }
    .search-box { display: flex; align-items: center; height: 62px; padding: 0 20px; border: 1px solid rgba(220,238,222,.12); border-radius: 15px; background: rgba(24,30,25,.9); box-shadow: var(--shadow); transition: border-color .2s, box-shadow .2s; }
    .search-box:focus-within { border-color: rgba(197,243,107,.48); box-shadow: 0 0 0 4px rgba(197,243,107,.06), var(--shadow); }
    .search-icon { width: 19px; height: 19px; flex: none; color: var(--soft); }
    #search { width: 100%; padding: 0 15px; outline: 0; border: 0; background: transparent; color: var(--text); font-size: 15px; }
    #search::placeholder { color: #778078; }
    .search-hint { display: flex; align-items: center; gap: 6px; color: var(--soft); font: 10px 'DM Mono', monospace; white-space: nowrap; }
    kbd { padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; color: #89958a; background: rgba(255,255,255,.035); font: inherit; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-title { display: flex; align-items: center; gap: 9px; color: #dfe7dd; font: 600 13px 'Manrope', sans-serif; letter-spacing: -.1px; }
    .section-title svg { width: 15px; height: 15px; color: var(--green); }
    .section-label { color: var(--soft); font: 10px 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .12em; }
    .links-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 11px; }
    .link-card { position: relative; min-height: 130px; padding: 17px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); text-decoration: none; color: var(--text); transition: transform .18s, background .18s, border-color .18s; overflow: hidden; }
    .link-card:hover { transform: translateY(-3px); background: var(--panel-hover); border-color: rgba(220,238,222,.2); }
    .link-icon { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.035); font-size: 17px; }
    .link-name { display: block; margin-top: 16px; font-size: 12px; font-weight: 600; }
    .link-url { display: block; margin-top: 4px; color: var(--soft); font: 9px 'DM Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link-delete { display: none; position: absolute; top: 10px; right: 10px; width: 23px; height: 23px; border: 0; border-radius: 50%; background: rgba(10,14,11,.8); color: #d8aaa1; cursor: pointer; font-size: 14px; line-height: 1; }
    body.editing .link-delete { display: grid; place-items: center; }
    .add-card { display: flex; min-height: 130px; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border: 1px dashed rgba(220,238,222,.18); border-radius: 14px; background: transparent; color: var(--muted); cursor: pointer; transition: .18s; }
    .add-card:hover { border-color: rgba(197,243,107,.5); color: var(--green); background: rgba(197,243,107,.035); }
    .add-plus { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 50%; background: rgba(255,255,255,.055); font-size: 20px; font-weight: 300; }
    .add-card span:last-child { font-size: 11px; }
    .lower-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 50px; }
    .widget { min-height: 270px; padding: 21px 22px; border: 1px solid var(--line); border-radius: 15px; background: rgba(24,30,25,.82); }
    .widget .section-heading { margin-bottom: 19px; }
    .widget-count { color: var(--soft); font: 10px 'DM Mono', monospace; }
    .task-form { display: flex; gap: 9px; margin-bottom: 15px; }
    .task-input { width: 100%; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; outline: 0; background: rgba(255,255,255,.035); color: var(--text); font-size: 12px; }
    .task-input:focus, .note:focus { border-color: rgba(197,243,107,.4); }
    .task-input::placeholder, .note::placeholder { color: #748076; }
    .add-task { flex: none; width: 40px; border: 0; border-radius: 9px; background: var(--green); color: #1a240f; cursor: pointer; font-size: 19px; font-weight: 400; }
    .tasks { display: grid; gap: 7px; max-height: 147px; overflow: auto; }
    .task-row { display: flex; align-items: center; gap: 10px; min-height: 35px; color: #c6cec5; font-size: 12px; }
    .task-check { appearance: none; width: 16px; height: 16px; flex: none; margin: 0; border: 1px solid #536052; border-radius: 5px; cursor: pointer; }
    .task-check:checked { border-color: var(--green); background: var(--green); box-shadow: inset 0 0 0 3px var(--panel); }
    .task-text { flex: 1; overflow-wrap: anywhere; }
    .task-row.done .task-text { color: var(--soft); text-decoration: line-through; }
    .task-remove { border: 0; background: none; color: #718074; cursor: pointer; font-size: 16px; opacity: 0; }
    .task-row:hover .task-remove { opacity: 1; }
    .empty-state { padding: 13px 0; color: var(--soft); font-size: 11px; }
    .note { display: block; width: 100%; min-height: 168px; resize: vertical; padding: 14px; border: 1px solid var(--line); border-radius: 10px; outline: 0; background: rgba(255,255,255,.025); color: #d7dfd5; font-size: 12px; line-height: 1.65; }
    .note-meta { display: flex; justify-content: space-between; margin-top: 9px; color: var(--soft); font: 9px 'DM Mono', monospace; }
    footer { display: flex; justify-content: space-between; margin-top: 35px; color: #68736a; font: 9px 'DM Mono', monospace; letter-spacing: .02em; }
    footer span:last-child { color: #859082; }
    dialog { width: min(420px, calc(100% - 32px)); padding: 0; border: 1px solid rgba(220,238,222,.16); border-radius: 16px; background: #1a211b; color: var(--text); box-shadow: 0 30px 100px #0009; }
    dialog::backdrop { background: rgba(5,8,6,.72); backdrop-filter: blur(5px); }
    .dialog-inner { padding: 23px; }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .dialog-head h2 { margin: 0; font: 700 17px 'Manrope', sans-serif; }
    .close-dialog { width: 30px; height: 30px; border: 0; border-radius: 8px; background: rgba(255,255,255,.05); color: var(--muted); cursor: pointer; font-size: 18px; }
    .field { display: grid; gap: 7px; margin-bottom: 14px; }
    .field label { color: var(--muted); font: 10px 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .1em; }
    .field input { height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; outline: 0; background: #111713; color: var(--text); font-size: 12px; }
    .field input:focus { border-color: rgba(197,243,107,.45); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
    .dialog-actions button { height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; }
    .dialog-actions .save-link { border-color: var(--green); background: var(--green); color: #1a240f; font-weight: 700; }
    @media (max-width: 800px) { .links-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } header { margin-bottom: 54px; } }
    @media (max-width: 560px) {
      .shell { width: min(100% - 30px, 440px); padding-top: 22px; }
      header { margin-bottom: 52px; }
      .date-pill { display: none; }
      h1 { letter-spacing: -1.7px; }
      .subtitle { max-width: 300px; line-height: 1.5; }
      .search-wrap { margin: 24px 0 39px; }
      .search-box { height: 57px; padding: 0 15px; }
      .search-hint { display: none; }
      .links-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
      .link-card, .add-card { min-height: 119px; padding: 14px; }
      .lower-grid { grid-template-columns: 1fr; gap: 11px; margin-top: 39px; }
      .widget { min-height: 240px; padding: 18px; }
      footer { margin-top: 27px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 20v-6h6v6" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></span>Homepage</div>
      <div class="header-right"><div class="date-pill" id="date"></div><button class="icon-button" id="edit-toggle" title="Edit your shortcuts" aria-label="Edit your shortcuts"><svg viewBox="0 0 24 24" fill="none"><path d="m14 5 5 5M4 20l4.2-.8L19 8.4a2.1 2.1 0 0 0-3-3L5.2 16.2 4 20Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    </header>
    <section class="intro">
      <div class="eyebrow" id="greeting">A fresh start</div>
      <h1>Make yourself <span>at home.</span></h1>
      <p class="subtitle">Your corner of the internet. Everything you need, right here.</p>
    </section>
    <form class="search-wrap" id="search-form" role="search">
      <div class="search-box"><svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input id="search" type="search" autocomplete="off" placeholder="Search the web or type a URL…" aria-label="Search the web or type a URL"><div class="search-hint"><kbd>↵</kbd> to search</div></div>
    </form>
    <section aria-labelledby="links-title">
      <div class="section-heading"><div class="section-title" id="links-title"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Quick links</div><div class="section-label" id="link-count"></div></div>
      <div class="links-grid" id="links-grid"></div>
    </section>
    <section class="lower-grid" aria-label="Personal widgets">
      <div class="widget">
        <div class="section-heading"><div class="section-title"><svg viewBox="0 0 24 24" fill="none"><path d="M7 4v3m10-3v3M4.5 9h15M6 5.5h12A1.5 1.5 0 0 1 19.5 7v12A1.5 1.5 0 0 1 18 20.5H6A1.5 1.5 0 0 1 4.5 19V7A1.5 1.5 0 0 1 6 5.5Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="m8 14 2 2 5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Things to do</div><div class="widget-count" id="task-count"></div></div>
        <form class="task-form" id="task-form"><input class="task-input" id="task-input" maxlength="120" placeholder="Add something to your list…" aria-label="New task"><button class="add-task" aria-label="Add task">+</button></form>
        <div class="tasks" id="tasks"></div>
      </div>
      <div class="widget">
        <div class="section-heading"><div class="section-title"><svg viewBox="0 0 24 24" fill="none"><path d="M7 4.5h10A2.5 2.5 0 0 1 19.5 7v10a2.5 2.5 0 0 1-2.5 2.5H7A2.5 2.5 0 0 1 4.5 17V7A2.5 2.5 0 0 1 7 4.5Z" stroke="currentColor" stroke-width="1.7"/><path d="M8 9h8M8 12.5h8M8 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Scratchpad</div><div class="widget-count" id="note-status">SAVED LOCALLY</div></div>
        <textarea class="note" id="note" maxlength="2000" placeholder="Drop a thought here. Your note stays saved on this device."></textarea><div class="note-meta"><span>JUST FOR YOU</span><span id="note-length">0 / 2000</span></div>
      </div>
    </section>
    <footer><span>CREATED BY IZAYAH ODEH</span><span id="clock"></span></footer>
  </main>
  <dialog id="link-dialog">
    <form class="dialog-inner" id="link-form">
      <div class="dialog-head"><h2>Add a quick link</h2><button class="close-dialog" type="button" aria-label="Close">×</button></div>
      <div class="field"><label for="link-name">Name</label><input id="link-name" required maxlength="30" placeholder="For example, Music"></div>
      <div class="field"><label for="link-url">Website address</label><input id="link-url" required type="url" placeholder="https://example.com"></div>
      <div class="field"><label for="link-icon">Emoji icon</label><input id="link-icon" maxlength="8" placeholder="✨"></div>
      <div class="dialog-actions"><button type="button" class="cancel-dialog">Cancel</button><button type="submit" class="save-link">Add link</button></div>
    </form>
  </dialog>
  <script>
    const defaults = [
      { name: 'Google', url: 'https://google.com', icon: '🔎' },
      { name: 'YouTube', url: 'https://youtube.com', icon: '▶️' },
      { name: 'Gmail', url: 'https://mail.google.com', icon: '✉️' },
      { name: 'Google Drive', url: 'https://drive.google.com', icon: '📁' }
    ];
    const read = (key, fallback) => { try { const value = localStorage.getItem(key); return value ? JSON.parse(value) : fallback; } catch { return fallback; } };
    let links = read('homebase-links', defaults);
    let tasks = read('homebase-tasks', []);
    const $ = (selector) => document.querySelector(selector);
    const save = (key, value) => localStorage.setItem(key, JSON.stringify(value));

    function renderLinks() {
      const grid = $('#links-grid'); grid.replaceChildren();
      links.forEach((link, index) => {
        const card = document.createElement('a'); card.className = 'link-card'; card.href = link.url; card.target = '_blank'; card.rel = 'noopener noreferrer';
        const icon = document.createElement('span'); icon.className = 'link-icon'; icon.textContent = link.icon || '↗';
        const name = document.createElement('span'); name.className = 'link-name'; name.textContent = link.name;
        const url = document.createElement('span'); url.className = 'link-url'; url.textContent = link.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
        const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'link-delete'; remove.setAttribute('aria-label', `Remove ${link.name}`); remove.textContent = '×';
        remove.addEventListener('click', (event) => { event.preventDefault(); event.stopPropagation(); links.splice(index, 1); save('homebase-links', links); renderLinks(); });
        card.append(icon, name, url, remove); grid.append(card);
      });
      const add = document.createElement('button'); add.type = 'button'; add.className = 'add-card'; add.innerHTML = '<span class="add-plus">+</span><span>Add a link</span>'; add.addEventListener('click', () => $('#link-dialog').showModal()); grid.append(add);
      $('#link-count').textContent = `${links.length} SAVED`;
    }

    function renderTasks() {
      const list = $('#tasks'); list.replaceChildren();
      if (!tasks.length) { const empty = document.createElement('div'); empty.className = 'empty-state'; empty.textContent = 'Nothing on the list yet. Add a task to get started.'; list.append(empty); }
      tasks.forEach((task, index) => {
        const row = document.createElement('div'); row.className = `task-row${task.done ? ' done' : ''}`;
        const check = document.createElement('input'); check.type = 'checkbox'; check.className = 'task-check'; check.checked = task.done; check.setAttribute('aria-label', `Mark ${task.text} complete`);
        check.addEventListener('change', () => { tasks[index].done = check.checked; save('homebase-tasks', tasks); renderTasks(); });
        const text = document.createElement('span'); text.className = 'task-text'; text.textContent = task.text;
        const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'task-remove'; remove.setAttribute('aria-label', `Delete ${task.text}`); remove.textContent = '×';
        remove.addEventListener('click', () => { tasks.splice(index, 1); save('homebase-tasks', tasks); renderTasks(); });
        row.append(check, text, remove); list.append(row);
      });
      const open = tasks.filter(task => !task.done).length; $('#task-count').textContent = `${open} LEFT`;
    }

    $('#search-form').addEventListener('submit', (event) => {
      event.preventDefault(); const query = $('#search').value.trim(); if (!query) return;
      const looksLikeUrl = /^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}([/:?#][^\s]*)?$/i.test(query);
      window.location.href = looksLikeUrl ? (query.startsWith('http') ? query : `https://${query}`) : `https://www.google.com/search?q=${encodeURIComponent(query)}`;
    });
    window.addEventListener('keydown', (event) => { if (event.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) { event.preventDefault(); $('#search').focus(); } });
    $('#task-form').addEventListener('submit', (event) => { event.preventDefault(); const input = $('#task-input'); const text = input.value.trim(); if (!text) return; tasks.unshift({ text, done: false }); save('homebase-tasks', tasks); input.value = ''; renderTasks(); });
    $('#note').value = localStorage.getItem('homebase-note') || '';
    function noteInfo() { $('#note-length').textContent = `${$('#note').value.length} / 2000`; }
    $('#note').addEventListener('input', () => { localStorage.setItem('homebase-note', $('#note').value); $('#note-status').textContent = 'SAVING…'; noteInfo(); clearTimeout(window.noteSaveTimer); window.noteSaveTimer = setTimeout(() => $('#note-status').textContent = 'SAVED LOCALLY', 350); }); noteInfo();

    $('#edit-toggle').addEventListener('click', () => { document.body.classList.toggle('editing'); const active = document.body.classList.contains('editing'); $('#edit-toggle').title = active ? 'Done editing' : 'Edit your shortcuts'; $('#edit-toggle').style.color = active ? 'var(--green)' : ''; });
    const dialog = $('#link-dialog');
    $('.close-dialog').addEventListener('click', () => dialog.close()); $('.cancel-dialog').addEventListener('click', () => dialog.close());
    $('#link-form').addEventListener('submit', (event) => { event.preventDefault(); const name = $('#link-name').value.trim(); let url = $('#link-url').value.trim(); if (!/^https?:\/\//i.test(url)) url = `https://${url}`; links.push({ name, url, icon: $('#link-icon').value.trim() || '↗' }); save('homebase-links', links); renderLinks(); event.target.reset(); dialog.close(); });
    dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });

    function updateTime() {
      const now = new Date();
      $('#date').textContent = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric' }).format(now).toUpperCase();
      $('#clock').textContent = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(now);
      const hour = now.getHours(); $('#greeting').textContent = hour < 12 ? 'GOOD MORNING' : hour < 18 ? 'GOOD AFTERNOON' : 'GOOD EVENING';
    }
    updateTime(); setInterval(updateTime, 30000); renderLinks(); renderTasks();
  </script>
</body>
</html>
